name: CI/CD for GoalSchool

on:
  push:
    branches:
      - main   # change if your main branch is different (e.g. 'master')
  workflow_dispatch:   # allow manual trigger too

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # 🔐 This links to the 'production' environment with approval
    environment:
      name: production
      url: http://goalschool.edu.in

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: List build files
        run: ls -R build

      - name: Upload build to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "build/*"
          target: "${{ secrets.SERVER_PATH }}/build"

      # Optional: reload apache (usually not needed for static files)
      # - name: Reload Apache
      #   uses: appleboy/ssh-action@v0.1.10
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     password: ${{ secrets.SERVER_PASSWORD }}
      #     port: 22
      #     script: |
      #       sudo systemctl reload apache2
