name: CI/CD for GoalSchool

on:
  push:
    branches:
      - main        # change if your main branch is different (e.g. 'master')
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # 🔐 This links to the 'production' environment with approval (permission-based)
    environment:
      name: production
      url: http://goalschool.edu.in

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: List build files
        run: ls -R build

      # 🔍 Debug: check that secrets are present (without showing password)
      - name: Debug connection variables (no password)
        run: |
          echo "SERVER_HOST: '${{ secrets.SERVER_HOST }}'"
          echo "SERVER_USER: '${{ secrets.SERVER_USER }}'"
          echo "SERVER_PATH: '${{ secrets.SERVER_PATH }}'"
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "ERROR: SERVER_HOST is empty"; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "ERROR: SERVER_USER is empty"; fi
          if [ -z "${{ secrets.SERVER_PASSWORD }}" ]; then echo "ERROR: SERVER_PASSWORD is empty"; fi
          if [ -z "${{ secrets.SERVER_PATH }}" ]; then echo "ERROR: SERVER_PATH is empty"; fi

      # 🔍 Test SSH & directory on the server
      - name: Test SSH and prepare target directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22022
          script: |
            echo "Connected to server"
            echo "Using base path: ${{ secrets.SERVER_PATH }}"
            # Create GoalSchool + build dir if not exists
            mkdir -p ${{ secrets.SERVER_PATH }}/build
            echo "Listing base path:"
            ls -la ${{ secrets.SERVER_PATH }}
            echo "Listing build path:"
            ls -la ${{ secrets.SERVER_PATH }}/build || echo "build folder exists but is empty"

      # 📤 Upload build files to server
      - name: Upload build to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "build/*"
          target: "${{ secrets.SERVER_PATH }}/build"
          debug: true   # more logs if something fails

      # 🔁 Optional: reload Apache (only if you want, usually not required for static files)
      # - name: Reload Apache
      #   uses: appleboy/ssh-action@v0.1.10
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     password: ${{ secrets.SERVER_PASSWORD }}
      #     port: 22
      #     script: |
      #       sudo systemctl reload apache2
