name: CI/CD for GoalSchool

on:
  push:
    branches:
      - main   # change if your main branch is different (e.g. 'master')
  workflow_dispatch:   # allow manual trigger too

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # 🔐 This links to the 'production' environment with approval
    environment:
      name: Production
      url: http://goalschool.edu.in

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: List build files
        run: ls -R build

      # 🔍 Debug: check that secrets are set (without showing password)
      - name: Debug connection variables (no password)
        run: |
          echo "SERVER_HOST: ${{ secrets.SERVER_HOST }}"
          echo "SERVER_USER: ${{ secrets.SERVER_USER }}"
          echo "SERVER_PATH: ${{ secrets.SERVER_PATH }}"
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "ERROR: SERVER_HOST is empty"; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "ERROR: SERVER_USER is empty"; fi
          if [ -z "${{ secrets.SERVER_PASSWORD }}" ]; then echo "ERROR: SERVER_PASSWORD is empty"; fi
          if [ -z "${{ secrets.SERVER_PATH }}" ]; then echo "ERROR: SERVER_PATH is empty"; fi

      # (Optional but very useful) Try SSH and list target dir
      - name: Test SSH and list target directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            echo "Connected to server"
            ls -la ${{ secrets.SERVER_PATH }}
            ls -la ${{ secrets.SERVER_PATH }}/build || echo "build folder does not exist yet"

      - name: Upload build to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "build/*"
          target: "${{ secrets.SERVER_PATH }}/build"
          debug: true   # 👈 more detailed logs
