  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://goalschool.edu.in

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: List build files
        run: ls -R build

      - name: Debug connection variables (no password)
        run: |
          echo "SERVER_HOST: '${{ secrets.SERVER_HOST }}'"
          echo "SERVER_USER: '${{ secrets.SERVER_USER }}'"
          echo "SERVER_PATH: '${{ secrets.SERVER_PATH }}'"

      - name: Test SSH and list target directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22022          # 👈 your SSH port
          script: |
            echo "Connected to server"
            echo "Using base path: ${{ secrets.SERVER_PATH }}"
            echo "Base path listing:"
            ls -la ${{ secrets.SERVER_PATH }} || echo "Base path missing!"
            echo "Build path listing:"
            ls -la ${{ secrets.SERVER_PATH }}/build || echo "build folder exists but is empty"

      - name: Upload build to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22022          # 👈 same port here
          source: "build/*"
          target: "${{ secrets.SERVER_PATH }}/build"
          debug: true
